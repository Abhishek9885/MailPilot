[project]
name = "mailpilot-ai"
version = "0.1.0"
description = "MailPilot AI service foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "joblib==1.6.0",
  "langgraph==1.2.22",
  "langgraph-checkpoint-postgres==3.2.1",
  "numpy==2.5.5",
  "psycopg[binary]==3.2.10",
  "psycopg-pool==3.3.3",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "structlog==25.4.0",
  "tiktoken==0.14.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.14.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailpilot_ai"]
artifacts = ["src/mailpilot_ai/vector_store/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib", "scipy.*", "sklearn.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra -p no:cacheprovider"
